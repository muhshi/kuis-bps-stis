version: '3.8'

services:
  kuis-app:
    build: .
    container_name: kuis-stis-bps
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/src/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - ADMIN_TOKEN=bps-stis-2026
      # (Opsional) Jika ingin menghubungkan ke PostgreSQL server:
      # - PGHOST=10.133.21.24
      # - PGPORT=5433
      # - PGUSER=postgres
      # - PGPASSWORD=your_postgres_password
      # - PGDATABASE=kuis_stis
